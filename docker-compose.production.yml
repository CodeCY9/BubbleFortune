services:
  proxy:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/proxy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./docker/certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://127.0.0.1:443/readyz || exit 1"]
