services:
  postgres:
    image: postgres:16-alpine
    container_name: bf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bubble_fortune}
      POSTGRES_USER: ${POSTGRES_USER:-bubble_fortune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bubble_fortune} -d ${POSTGRES_DB:-bubble_fortune}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bf-network

  game-server:
    build:
      context: .
      target: runner
    container_name: bf-game-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 2567
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-bubble_fortune}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bubble_fortune}}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      BF_ADMIN_TOKEN: ${BF_ADMIN_TOKEN:?BF_ADMIN_TOKEN must be configured}
      BF_RISK_SECRET: ${BF_RISK_SECRET:?BF_RISK_SECRET must be configured}
    volumes:
      - outbox-data:/app/.data/history-outbox
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bf-network

  web:
    build:
      context: .
      target: web
    container_name: bf-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/index.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - bf-network

  proxy:
    image: nginx:alpine
    container_name: bf-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      game-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - bf-network

volumes:
  postgres-data:
    name: bf-postgres-data
  outbox-data:
    name: bf-outbox-data

networks:
  bf-network:
    driver: bridge
