map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web_upstream {
    server web:80;
    keepalive 32;
}

upstream game_server_upstream {
    server game-server:2567;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Client payload limit matching server maximum (16KiB body + headers)
    client_max_body_size 64k;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket and Colyseus game traffic:
    # Rewrites /game prefix so Colyseus receives matchmake and room routes at root
    location /game {
        rewrite ^/game(?:/(.*))?$ /$1 break;
        proxy_pass http://game_server_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarded identity headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Extended timeouts for long-running game sessions
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # HTTP API proxy: pass directly to game-server
    location /api {
        proxy_pass http://game_server_upstream;
        proxy_http_version 1.1;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # Application health endpoints must bypass the static web container so
    # readiness reflects the game server and PostgreSQL migration state.
    location = /healthz {
        proxy_pass http://game_server_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }

    location = /readyz {
        proxy_pass http://game_server_upstream/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }

    # Static frontend web application
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
